services:
  # -------------------------------------------------------------------------
  # Giving API: Node/Express, backed by Supabase Postgres.
  # -------------------------------------------------------------------------
  - type: web
    name: rpai-give-api
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    rootDir: server
    buildCommand: npm install
    startCommand: npm run db:migrate && npm start
    healthCheckPath: /api/health
    # Every commit to `main` rebuilds this service. The static site below uses
    # the same trigger, so one push deploys frontend and backend together.
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      # Supabase session pooler. Paste the full postgresql:// URL from
      # Supabase -> Project Settings -> Database -> Connection string.
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_WEBHOOK_SECRET
        sync: false
      - key: PAYSTACK_CURRENCY
        value: ZMW
      # Required. Confirm 0 or 2 with Paystack before taking live payments.
      - key: PAYSTACK_CURRENCY_EXPONENT
        sync: false
      - key: PAYSTACK_OPERATORS
        value: mtn,airtel
      - key: PAYSTACK_MIN_AMOUNT
        value: "1"
      - key: PAYSTACK_MAX_AMOUNT
        value: "1000000"
      # Add the final frontend URL here if Render appends a suffix to the
      # static-site name. The GitHub Pages origin stays allowed during the
      # transition.
      - key: ALLOWED_ORIGIN
        value: https://nduwamakinka.github.io,https://royal-priesthood-assemblies-int-l-1.onrender.com,https://rpai-church-site.onrender.com
      - key: PUBLIC_SITE_URL
        value: https://royal-priesthood-assemblies-int-l-1.onrender.com
      # Online meeting admin. The pastor uses /admin on this same API host.
      - key: CONFERENCE_ADMIN_PASSWORD
        sync: false
      - key: CONFERENCE_ADMIN_SECRET
        sync: false
      - key: CONFERENCE_ADMIN_TOKEN_HOURS
        value: "8"
      # Email delivery for the meeting link. Set RESEND_API_KEY here, or add
      # the SMTP_* variables in the Render dashboard. These are intentionally
      # not given placeholder values: an unconfigured API refuses registrations
      # rather than collecting addresses it cannot email.
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        value: Royal Priesthood Assemblies International <royalpriesthoodassembliesintl@gmail.com>
      - key: MAIL_REPLY_TO
        value: royalpriesthoodassembliesintl@gmail.com

  # -------------------------------------------------------------------------
  # Static church website. scripts/build-static.mjs copies only the public
  # site files into dist/ so the API, docs and admin tooling are not served.
  # -------------------------------------------------------------------------
  - type: web
    name: rpai-church-site
    runtime: static
    branch: main
    buildCommand: node scripts/build-static.mjs
    staticPublishPath: dist
    # Paired with rpai-give-api above: the same commit deploys both.
    autoDeployTrigger: commit
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      # Fingerprinted/versioned assets can be cached for longer. The HTML
      # itself is left to Render's default revalidation so edits go live.
      - path: /*.css
        name: Cache-Control
        value: public, max-age=604800
      - path: /*.js
        name: Cache-Control
        value: public, max-age=604800
      - path: /*.woff2
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*.webp
        name: Cache-Control
        value: public, max-age=604800
      - path: /*.png
        name: Cache-Control
        value: public, max-age=604800
      - path: /*.jpg
        name: Cache-Control
        value: public, max-age=604800
      - path: /*.jpeg
        name: Cache-Control
        value: public, max-age=604800
      # deploy.py reads this file after every deploy. It must never be cached,
      # otherwise the check can report an old commit as live.
      - path: /deploy-info.json
        name: Cache-Control
        value: no-store, must-revalidate
